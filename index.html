<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />

  <!-- Decide kiosk or web once, before any stylesheet loads, so each mode gets
       only its own CSS and never flashes the other's. ?mode= wins; otherwise
       being inside an iframe means the XENEON EDGE. app.js reads data-mode.

       It also loads the app itself, stamped with ?v= (see below). -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var asked = params.get("mode");
      var mode = asked === "kiosk" || asked === "web" ? asked
        : (window.self !== window.top ? "kiosk" : "web");
      var root = document.documentElement;
      root.dataset.mode = mode;

      // ?v= cache-busts every file the page loads, not just this HTML. iCUE
      // keeps the widget's scripts cached across a redeploy, and bumping v
      // only changed index.html's own URL, so the Edge ran new HTML with old
      // JavaScript. Without ?v= (the web app) the URLs stay plain.
      var v = (params.get("v") || "").replace(/[^\w.-]/g, "").slice(0, 32);
      var stamp = v ? "?v=" + v : "";

      var sheets = mode === "kiosk"
        ? ["tokens", "base", "components", "views", "layout", "treatments"]
        : ["web", "treatments"];
      sheets.forEach(function (name) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "wwwroot/css/" + name + ".css" + stamp;
        // Script-inserted stylesheets do not block rendering by default.
        link.setAttribute("blocking", "render");
        document.head.appendChild(link);
      });

      if (mode === "web") {
        // The web app follows the system light/dark setting; the kiosk is
        // always dark.
        document.querySelector('meta[name="color-scheme"]').content = "light dark";
        var tc = document.querySelector('meta[name="theme-color"]');
        tc.content = "#f5f3f7";
        tc.media = "(prefers-color-scheme: light)";
        var dark = document.createElement("meta");
        dark.name = "theme-color";
        dark.content = "#0f0d12";
        dark.media = "(prefers-color-scheme: dark)";
        document.head.appendChild(dark);

        // Display and body faces. Not render-blocking: display=swap falls back
        // to the system stack in web.css if Google Fonts is slow or blocked.
        var fonts = document.createElement("link");
        fonts.rel = "stylesheet";
        fonts.href = "https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700"
          + "&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap";
        document.head.appendChild(fonts);
      }

      // The stamp only reaches modules imported by other modules through an
      // import map, which has to exist before the first module loads - so
      // the entry script is added here too, after it. Every module under
      // wwwroot/js belongs in this list; one missing still loads, just
      // without the stamp.
      if (stamp) {
        var modules = [
          "app", "kiosk", "web", "api", "components", "config", "constants", "dom",
          "format", "gains", "hiscore-data", "history", "mode", "model", "osrs", "store",
          "wom", "views/gim", "views/item", "views/team", "views/total",
          "web/compare", "web/overview", "web/parts", "web/player", "web/training"
        ];
        var imports = {};
        modules.forEach(function (name) {
          var path = "./wwwroot/js/" + name + ".js";
          imports[path] = path + stamp;
        });
        var map = document.createElement("script");
        map.type = "importmap";
        map.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(map);
      }

      var entry = document.createElement("script");
      entry.type = "module";
      entry.src = "wwwroot/js/app.js" + stamp;
      document.head.appendChild(entry);
    })();
  </script>

  <title>OSRS Progress Dashboard</title>
  <meta name="description" content="Old School RuneScape group ironman progress dashboard: skills, boss kill counts and team totals." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="OSRS Progress Dashboard" />
  <meta property="og:description" content="Live skill, boss and team-total tracking for our group ironman." />
  <link rel="icon" href="wwwroot/icons/skills/total.png" />
</head>
<body>
  <div id="app"></div>
</body>
</html>
